name: Build and Deploy to Steam
on:
  workflow_dispatch:

jobs:
  main:
    name: Build for ${{ matrix.targetPlatform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            targetPlatform: StandaloneWindows64
          - os: ubuntu-latest
            targetPlatform: StandaloneLinux64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install Banana Shooter Unlicensed Backup CLI
        shell: bash
        run: |
            if [ "${{ runner.os }}" = "Windows" ]; then
              TARGET="x86_64-pc-windows-msvc"
              ARCHIVE="bsubp-$TARGET.zip"
            elif [ "${{ runner.os }}" = "macOS" ]; then
              TARGET="x86_64-apple-darwin"
              ARCHIVE="bsubp-$TARGET.tar.gz"
            else
              TARGET="x86_64-unknown-linux-gnu"
              ARCHIVE="bsubp-$TARGET.tar.gz"
            fi

            mkdir -p "$HOME/.local/bin"
            curl -fsSL -o "$ARCHIVE" \
             "https://github.com/Squalive/bsubp/releases/latest/download/$ARCHIVE"

            if [[ "$ARCHIVE" == *.zip ]]; then
              unzip -o "$ARCHIVE" -d "$HOME/.local/bin"
              rm "$ARCHIVE"
            else
              tar -xzf "$ARCHIVE" -C "$HOME/.local/bin"
              rm "$ARCHIVE"
            fi

            chmod +x "$HOME/.local/bin/"bsubp* 2>/dev/null || true
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Build Project
        uses: game-ci/unity-builder@v4
        id: build
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          unityVersion: 2021.3.45f2
          versioning: Semantic

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
