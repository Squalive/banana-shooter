# This is intended as an automation for deploying updates, but since it's using secrets everywhere, forked repos can't run this workflow
name: Build and Deploy
on:
  workflow_call:
    inputs:
      linux_os:
        required: true
        type: string
      windows_os:
        required: true
        type: string
      # 'nightly' or 'semantic'
      version_scheme:
        required: true
        type: string
      build_description:
        required: true
        type: string
    secrets:
      UNITY_LICENSE: { required: true }
      UNITY_EMAIL: { required: true }
      UNITY_PASSWORD: { required: true }
      R2_ACCESS_KEY_ID: { required: true }
      R2_ACCOUNT_ID: { required: true }
      R2_SECRET_ACCESS_KEY: { required: true }
      STEAM_USERNAME: { required: true }
      STEAM_CONFIG_VDF: { required: true }

jobs:
  build:
    name: Build ${{ matrix.subtarget }} for ${{ matrix.targetPlatform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ${{ inputs.windows_os }}
            targetPlatform: StandaloneWindows64
            subtarget: Client
            buildName: Banana Shooter
            cachePrefix: Library
          - os: ${{ inputs.linux_os }}
            targetPlatform: StandaloneLinux64
            subtarget: Client
            buildName: Banana Shooter
            cachePrefix: Library
          - os: ${{ inputs.linux_os }}
            targetPlatform: StandaloneLinux64
            subtarget: Server
            buildName: bsds
            cachePrefix: Library-Server

    steps:
      - name: Free Disk Space (Ubuntu)
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v2
        with:
          tool-cache: false

      # Checkout (without LFS)
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Git LFS
      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v4
        id: lfs-cache
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Git LFS Pull
        run: |
          git lfs pull
          git add .
          git reset --hard

      - name: Compute version
        id: version
        shell: bash
        run: |
          if [[ "${{ inputs.version_scheme }}" == "nightly" ]]; then
            BASE=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || echo "v0.0.0")
            BASE=${BASE#v}
            DATE=$(date +'%Y%m%d')
            SHA=$(echo ${{ github.sha }} | cut -c1-7)
            echo "versioning=Custom" >> "$GITHUB_OUTPUT"
            echo "version=${BASE}-nightly.${DATE}.${SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "versioning=Semantic" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache library
        uses: actions/cache@v4
        with:
          path: Library
          key: ${{ matrix.cachePrefix }}-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            ${{ matrix.cachePrefix }}-${{ matrix.targetPlatform }}-
            ${{ matrix.cachePrefix }}-

      - uses: ./.github/actions/install-bsubp

      - name: Restore Unlicensed Assets
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
            bsubp restore 2026-10-13T09-37-48Z -c

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          unityVersion: 2021.3.45f2
          versioning: ${{ steps.version.outputs.versioning }}
          version: ${{ steps.version.outputs.version }}
          buildName: ${{ matrix.buildName }}
          customParameters: ${{ matrix.subtarget == 'Server' && '-standaloneBuildSubtarget Server' || '' }}

      - name: Remove IL2CPP/Burst debug directories
        shell: bash
        run: |
          SUDO=""
          if [ "${{ runner.os }}" = "Linux" ]; then SUDO="sudo"; fi

          $SUDO find build -type d \( \
            -name '*_BackUpThisFolder_ButDontShipItWithYourGame' -o \
            -name '*_BurstDebugInformation_DoNotShip' \
          \) -prune -exec rm -rf {} +

          if [ -n "$SUDO" ]; then
            $SUDO chown -R "$(id -u):$(id -g)" build
          fi

          echo "Remaining build contents:"
          find build -maxdepth 2 -type d

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.subtarget }}-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
          retention-days: 1

  deploy:
    name: Deploy to Steam
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
    - name: Download Windows Client
      uses: actions/download-artifact@v4
      with:
        name: Client-StandaloneWindows64
        path: client/StandaloneWindows64

    - name: Download Linux Client
      uses: actions/download-artifact@v4
      with:
        name: Client-StandaloneLinux64
        path: client/StandaloneLinux64

    - name: Download Linux Server
      uses: actions/download-artifact@v4
      with:
        name: Server-StandaloneLinux64
        path: server/StandaloneLinux64

    - name: Deploy Client to Steam
      uses: game-ci/steam-deploy@v3
      with:
        username: ${{ secrets.STEAM_USERNAME }}
        configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
        appId: 1949740
        buildDescription: ${{ inputs.build_description }}
        rootPath: client
        depot1Path: StandaloneWindows64
        depot2Path: StandaloneLinux64
        releaseBranch: nightly

    - name: Deploy Server to Steam
      uses: game-ci/steam-deploy@v3
      with:
        username: ${{ secrets.STEAM_USERNAME }}
        configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
        appId: 2406780
        buildDescription: ${{ inputs.build_description }}
        rootPath: server
        # Windows is depot1 and will be removed in the future
        depot2Path: StandaloneLinux64
        releaseBranch: nightly

    - name: Delete artifacts
      uses: actions/github-script@v7
      with:
        script: |
          const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: context.runId,
          });
          for (const artifact of artifacts.data.artifacts) {
            await github.rest.actions.deleteArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id,
            });
          }
